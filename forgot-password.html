<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./images/icon.jpg" type="image/png">
</head>
<style>
body {
    background-image: url('./images/loginbg.png'); /* Replace with your actual image path */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: Arial, sans-serif;
}

.card {
    background-color: rgba(255, 255, 255, 0.9); 
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

label {
    color: #333;
}

input:focus {
    border-color: #007bff;
    outline: none;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
}

.text-decoration-none:hover {
    text-decoration: underline;
}
</style>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow-lg" style="width: 24rem;">
        <h2 class="text-center mb-4">Forgot Password</h2>
        <form id="forgot-password-form">
            <div class="mb-3">
                <label for="username-email" class="form-label">Username or Email</label>
                <input type="text" class="form-control" id="username-email" placeholder="Enter your username or email" required>
            </div>
            <div class="mb-3">
                <label for="new-password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="new-password" placeholder="Enter new password" required>
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confirm-password" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Update Password</button>
        </form>
        <div class="text-center mt-3">
            <a href="./login.html" class="text-decoration-none">Back to Login</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("forgot-password-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const usernameOrEmail = document.getElementById("username-email").value;
                const newPassword = document.getElementById("new-password").value;
                const confirmPassword = document.getElementById("confirm-password").value;

                if (newPassword !== confirmPassword) {
                    alert("Passwords do not match. Please try again.");
                    return;
                }

                try {
                    const response = await fetch("https://retoolapi.dev/Baqk59/data");
                    const users = await response.json();

                    const user = users.find(u => u.username === usernameOrEmail || u.email === usernameOrEmail);

                    if (user) {
                        const updateResponse = await fetch(`https://retoolapi.dev/Baqk59/data/${user.id}`, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ ...user, password: newPassword })
                        });

                        if (updateResponse.ok) {
                            alert("Password updated successfully! Redirecting to login...");
                            window.location.href = "./login.html";
                        } else {
                            alert("Failed to update password. Please try again.");
                        }
                    } else {
                        alert("User not found. Please check the username or email.");
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("An error occurred. Please try again.");
                }
            });
        });
    </script>

</body>
</html>
