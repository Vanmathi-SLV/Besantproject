<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Profile Page</title>
    <link rel="icon" href="./images/icon.jpg" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="./profile.css">
</head>
<body>
    <a href="./home.html" class="home-button">
        <i class="fas fa-home"></i> Home
    </a>
    <div class="form-container">
        <h2>User Profile</h2>
        <form id="profile-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required readonly> <!-- Username is read-only -->

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="button" id="update-btn">Update</button>
            <button type="button" id="cancel-btn">Cancel</button>
            <button id="deactivate-btn" class="deactivate-btn"><a href="./deactivate.html" style="text-decoration:none;">DeActivate Account</a></button>

            <!-- New Button for Order History -->
            <button type="button" id="view-order-history-btn" class="order-history-btn" onclick="window.location.href='./order-history.html'">View Order History</button>
        </form>
    </div>
    <script src="./profile.js"></script>
</body>
</html>
