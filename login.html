<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./images/icon.jpg" type="image/png">
</head>
<style>
  
body {
    background-image: url('./images/loginbg.png'); /* Replace with your actual image path */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: Arial, sans-serif;
}

.btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: white;
    font-size: 18px;
}

.btn-primary i {
    margin-right: 8px;
    font-size: 18px;
}


.card {
    background-color: rgba(255, 255, 255, 0.9); 
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}


label {
    color: #333;
}

input:focus {
    border-color: #007bff;
    outline: none;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
}


.text-decoration-none:hover {
    text-decoration: underline;
}

</style>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
   
    <a href="./home.html" class="btn btn-primary position-absolute top-0 end-0 m-3">
        <i class="fas fa-home"></i> Home
    </a>

    
    <div class="card p-4 shadow-lg" style="width: 24rem;">
        <h2 class="text-center mb-4">Login</h2>
        <form id="login-form">
            <div class="mb-3">
                <label for="login-username" class="form-label">Username</label>
                <input type="text" class="form-control" id="login-username" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
                <label for="login-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Login</button>
            <div class="text-center mt-3">
                <a href="./forgot-password.html" class="text-decoration-none">Forgot Password?</a>
            </div>
            
        </form>
        <div class="text-center mt-3">
            <a href="./index.html" class="text-decoration-none">Don’t have an account? Register</a>
        </div>
    </div>

    
 
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("login-form").addEventListener("submit", async function (e) {
                e.preventDefault();
        
                const username = document.getElementById("login-username").value;
                const password = document.getElementById("login-password").value;
        
                try {
                    const response = await fetch("https://retoolapi.dev/Baqk59/data");
                    const users = await response.json();
        
                    const user = users.find(u => u.username === username && u.password === password);
        
                    if (user) {
                        alert(`Welcome, ${user.name}!`);
                        
                        // Save user data in localStorage
                        localStorage.setItem("loggedInUser", JSON.stringify(user));
        
                        // Redirect to home page
                        window.location.href = "./home.html";
                    } else {
                        alert("Invalid username or password. Please try again.");
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("Failed to login. Please try again.");
                }
            });
        });
        </script>
        
</body>
</html>
