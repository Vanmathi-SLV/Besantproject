<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!-- Admin Dashboard -->
    <div class="container">
        <h1 class="text-center my-4">Admin Dashboard</h1>

        <!-- Logged-In User Details -->
        <div class="card p-4 shadow">
            <h3>Logged-In User Details</h3>
            <div id="user-details" class="mt-3"></div>
        </div>

        <!-- Registered Users List -->
        <div class="card p-4 shadow">
            <h3>Registered Users</h3>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="registered-users">
                        <!-- Registered users data will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Order Histories -->
        <div class="card p-4 shadow">
            <h3>Order Histories</h3>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Gas Type</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="order-history">
                        <!-- Order data will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Accept/Decline Order -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-labelledby="orderModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orderModalLabel">Manage Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <button id="acceptOrder" class="btn btn-success w-100 mb-3">Accept</button>
                    <button id="declineOrder" class="btn btn-danger w-100">Decline</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            try {
                // Get logged-in user details from localStorage
                const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));
                if (loggedInUser) {
                    const userDetailsContainer = document.getElementById("user-details");
                    userDetailsContainer.innerHTML = `
                        <p><strong>Name:</strong> ${loggedInUser.name}</p>
                        <p><strong>Username:</strong> ${loggedInUser.username}</p>
                        <p><strong>Email:</strong> ${loggedInUser.email || "N/A"}</p>
                    `;

                    // Fetch order histories using API
                    const response = await fetch("https://retoolapi.dev/ge9oTT/ordergas");
                    const orders = await response.json();

                    const orderHistoryContainer = document.getElementById("order-history");

                    if (orders.length > 0) {
                        orders.forEach(order => {
                            orderHistoryContainer.innerHTML += `
                                <tr id="order-${order.id}">
                                    <td>${order.id}</td>
                                    <td>${order.gasType}</td>
                                    <td>${order.phone}</td>
                                    <td>${order.status || 'Pending'}</td>
                                    <td>
                                        <button class="btn btn-primary btn-sm view-order" data-order-id="${order.id}" data-status="${order.status}">View</button>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        orderHistoryContainer.innerHTML = `
                            <tr>
                                <td colspan="5" class="text-center">No orders found.</td>
                            </tr>
                        `;
                    }
                } else {
                    alert("No user is logged in. Please log in to view this page.");
                    window.location.href = "./login.html";
                }

                // Fetch registered users using API
                const usersResponse = await fetch("https://retoolapi.dev/Baqk59/data");
                const users = await usersResponse.json();
                const registeredUsersContainer = document.getElementById("registered-users");

                if (users.length > 0) {
                    users.forEach(user => {
                        registeredUsersContainer.innerHTML += `
                            <tr id="user-${user.username}">
                                <td>${user.name}</td>
                                <td>${user.username}</td>
                                <td>${user.email || 'N/A'}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm delete-user" data-username="${user.username}">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    registeredUsersContainer.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center">No registered users found.</td>
                        </tr>
                    `;
                }

                // Handle "View" order click
                document.querySelectorAll(".view-order").forEach(button => {
                    button.addEventListener("click", function () {
                        const orderId = this.getAttribute("data-order-id");
                        const orderStatus = this.getAttribute("data-status");

                        // Show modal with Accept/Decline buttons
                        const acceptButton = document.getElementById("acceptOrder");
                        const declineButton = document.getElementById("declineOrder");

                        // Handle Accept button
                        acceptButton.onclick = async function () {
                            await updateOrderStatus(orderId, "Successfully Booked");
                            document.getElementById(`order-${orderId}`).querySelector("td:nth-child(4)").textContent = "Successfully Booked";
                            // Close modal
                            let modal = bootstrap.Modal.getInstance(document.getElementById('orderModal'));
                            modal.hide();
                        };

                        // Handle Decline button
                        declineButton.onclick = async function () {
                            await updateOrderStatus(orderId, "Pending");
                            document.getElementById(`order-${orderId}`).querySelector("td:nth-child(4)").textContent = "Pending";
                            // Close modal
                            let modal = bootstrap.Modal.getInstance(document.getElementById('orderModal'));
                            modal.hide();
                        };

                        // Show modal
                        let modal = new bootstrap.Modal(document.getElementById('orderModal'));
                        modal.show();
                    });
                });

                // Handle "Delete" user click
                document.querySelectorAll(".delete-user").forEach(button => {
                    button.addEventListener("click", async function () {
                        const username = this.getAttribute("data-username");
                        await deleteUser(username);
                        document.getElementById(`user-${username}`).remove(); // Remove user from table
                    });
                });

            } catch (error) {
                console.error("Error:", error);
                alert("Failed to load admin data. Please try again.");
            }
        });

        // Function to update order status
        async function updateOrderStatus(orderId, newStatus) {
            try {
                const response = await fetch(`https://retoolapi.dev/ge9oTT/ordergas/${orderId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ status: newStatus }),
                });
                if (!response.ok) throw new Error("Failed to update order status");
            } catch (error) {
                console.error("Error:", error);
                alert("Failed to update order status. Please try again.");
            }
        }

        // Function to delete user
        async function deleteUser(username) {
            try {
                const response = await fetch(`https://retoolapi.dev/Baqk59/data/${username}`, {
                    method: 'DELETE',
                });
                if (!response.ok) throw new Error("Failed to delete user");
            } catch (error) {
                console.error("Error:", error);
                alert("Failed to delete user. Please try again.");
            }
        }
    </script>
</body>
</html>
